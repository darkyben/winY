[package]
name = "winy"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gpui = { path = "upstream/crates/gpui", default-features = false, features = ["windows-manifest"] }
gpui_windows = { path = "upstream/crates/gpui_windows", default-features = false }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
raw-window-handle = "0.6"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"


[build-dependencies]
embed-resource = "3.0.12"
